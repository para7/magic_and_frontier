<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mob Stats</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 24px; }
    h1 { margin-bottom: 16px; font-size: 1.4rem; color: #fff; }
    .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    input[type="text"] {
      padding: 6px 12px; background: #2a2a2a; border: 1px solid #444;
      color: #e0e0e0; border-radius: 4px; font-size: 0.9rem; width: 220px;
    }
    input[type="text"]:focus { outline: none; border-color: #66aaff; }
    .filter-group { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; }
    label { cursor: pointer; color: #aaa; }
    label input { margin-right: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead th {
      background: #2c2c2c; padding: 8px 12px; text-align: left;
      border-bottom: 2px solid #444; cursor: pointer; user-select: none;
      white-space: nowrap; color: #ccc;
    }
    thead th:hover { background: #383838; }
    thead th.sort-asc::after { content: ' ▲'; font-size: 0.75em; }
    thead th.sort-desc::after { content: ' ▼'; font-size: 0.75em; }
    tbody tr { border-bottom: 1px solid #2a2a2a; }
    tbody tr:hover { background: #222; }
    td { padding: 6px 12px; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; color: #88ccff; }
    .category-passive { color: #88ee88; }
    .category-neutral { color: #eecc44; }
    .category-hostile { color: #ee6666; }
    .category-boss    { color: #cc88ff; }
    .category-other   { color: #aaaaaa; }
    .count { font-size: 0.8rem; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
<h1>Mob Stats</h1>
<div class="controls">
  <input type="text" id="search" placeholder="名前で絞り込み..." oninput="applyFilter()">
  <div class="filter-group">
    <label><input type="checkbox" checked value="passive"  onchange="applyFilter()"> <span class="category-passive">友好</span></label>
    <label><input type="checkbox" checked value="neutral"  onchange="applyFilter()"> <span class="category-neutral">中立</span></label>
    <label><input type="checkbox" checked value="hostile"  onchange="applyFilter()"> <span class="category-hostile">敵対</span></label>
    <label><input type="checkbox" checked value="boss"     onchange="applyFilter()"> <span class="category-boss">ボス</span></label>
    <label><input type="checkbox" checked value="other"    onchange="applyFilter()"> <span class="category-other">その他</span></label>
  </div>
</div>
<p class="count" id="count"></p>
<br>
<table id="mob-table">
  <thead>
    <tr>
      <th onclick="sortTable(0)">名前</th>
      <th onclick="sortTable(1)">カテゴリ</th>
      <th onclick="sortTable(2)">体力 (HP)</th>
    </tr>
  </thead>
  <tbody id="mob-body"></tbody>
</table>

const CAT_LABEL = { passive: "友好", neutral: "中立", hostile: "敵対", boss: "ボス", other: "その他" };

function hpStr(min, max) {
  return min === max ? String(min) : `${min}～${max}`;
}

let sortCol = 2, sortDir = 1;

function renderTable(data) {
  const tbody = document.getElementById("mob-body");
  tbody.innerHTML = data.map(m => `
    <tr data-cat="${m.cat}">
      <td>${m.name}</td>
      <td class="category-${m.cat}">${CAT_LABEL[m.cat]}</td>
      <td class="num">${hpStr(m.hpMin, m.hpMax)}</td>
    </tr>`).join("");
  document.getElementById("count").textContent = `${data.length} 件`;
  updateSortHeaders();
}

function getActiveCategories() {
  return Array.from(document.querySelectorAll('.filter-group input[type=checkbox]'))
    .filter(cb => cb.checked).map(cb => cb.value);
}

function applyFilter() {
  const q = document.getElementById("search").value.trim();
  const cats = getActiveCategories();
  let data = MOBS.filter(m => cats.includes(m.cat));
  if (q) data = data.filter(m => m.name.includes(q));
  data = sortData(data);
  renderTable(data);
}

function sortData(data) {
  return [...data].sort((a, b) => {
    let va, vb;
    if (sortCol === 0) { va = a.name; vb = b.name; return sortDir * va.localeCompare(vb, "ja"); }
    if (sortCol === 1) { va = a.cat; vb = b.cat; return sortDir * va.localeCompare(vb); }
    if (sortCol === 2) { va = a.hpMin; vb = b.hpMin; }
    return sortDir * (va - vb);
  });
}

function sortTable(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  applyFilter();
}

function updateSortHeaders() {
  document.querySelectorAll("thead th").forEach((th, i) => {
    th.classList.remove("sort-asc", "sort-desc");
    if (i === sortCol) th.classList.add(sortDir === 1 ? "sort-asc" : "sort-desc");
  });
}

applyFilter();
</script>

</html>
